name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
    - name: 'Auto-assign issue'
      if: |
        !contains(github.event.issue.labels.*.name, 'wontfix') &&
        !contains(github.event.pull_request.labels.*.name, 'wontfix') &&
        !contains(github.event.issue.title, 'wontfix') &&
        !contains(github.event.pull_request.title, 'wontfix')
      uses: pozil/auto-assign-issue@e0a56afd8846954587b00fff254caf1ec918554e # v1
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: GODWthIN7
          numOfAssignee: 1
