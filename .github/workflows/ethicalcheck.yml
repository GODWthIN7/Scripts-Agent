name: EthicalCheck Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Runs every Tuesday at 09:34 UTC.
    - cron: "34 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-ethicalcheck:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    env:
      ETHICALCHECK_OAS_URL: ${{ vars.ETHICALCHECK_OAS_URL }}
      ETHICALCHECK_EMAIL: ${{ secrets.ETHICALCHECK_EMAIL }}
    steps:
      - name: Check EthicalCheck configuration
        if: env.ETHICALCHECK_OAS_URL == '' || env.ETHICALCHECK_EMAIL == ''
        run: |
          echo "::notice::Skipping EthicalCheck scan. Configure vars.ETHICALCHECK_OAS_URL and secrets.ETHICALCHECK_EMAIL to enable this workflow."

      - name: EthicalCheck Free & Automated API Security Testing Service
        if: env.ETHICALCHECK_OAS_URL != '' && env.ETHICALCHECK_EMAIL != ''
        uses: apisec-inc/ethicalcheck-action@005fac321dd843682b1af6b72f30caaf9952c641
        with:
          oas-url: ${{ env.ETHICALCHECK_OAS_URL }}
          email: ${{ env.ETHICALCHECK_EMAIL }}
          sarif-result-file: "ethicalcheck-results.sarif"

      - name: Upload sarif file to repository
        if: env.ETHICALCHECK_OAS_URL != '' && env.ETHICALCHECK_EMAIL != ''
        uses: github/codeql-action/upload-sarif@b8d0e4f403b95d0c2d07a13d6f7d92f55b9f4cf7 # v3
        with:
          sarif-file: ./ethicalcheck-results.sarif
