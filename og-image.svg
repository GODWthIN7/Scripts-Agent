<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Scripts Agent social preview image</title>
  <desc id="desc">Social preview image for Scripts Agent showing the project name and tagline on a dark gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#081120" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="180" cy="110" r="220" fill="#7c3aed" opacity="0.18" />
  <circle cx="1040" cy="80" r="180" fill="#22d3ee" opacity="0.14" />
  <circle cx="980" cy="560" r="240" fill="#60a5fa" opacity="0.1" />

  <rect x="80" y="120" width="140" height="140" rx="36" fill="url(#accent)" />
  <text
    x="150"
    y="202"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="72"
    font-weight="800"
    fill="#ffffff"
  >
    S
  </text>

  <text
    x="80"
    y="340"
    font-family="Inter, Arial, sans-serif"
    font-size="76"
    font-weight="800"
    fill="#e2e8f0"
  >
    Scripts Agent
  </text>

  <text
    x="80"
    y="420"
    font-family="Inter, Arial, sans-serif"
    font-size="34"
    font-weight="500"
    fill="#94a3b8"
  >
    Automation tools, developer workflows, and production-ready experiments.
  </text>

  <text
    x="80"
    y="500"
    font-family="Inter, Arial, sans-serif"
    font-size="24"
    font-weight="600"
    fill="#cbd5e1"
  >
    github.com/GODWthIN7/Scripts-Agent
  </text>
</svg>
